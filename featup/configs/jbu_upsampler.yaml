# Environment Args
output_root: '/data/featup/'
pytorch_data_dir: '/data/cocostuff/dataset/'
submitting_to_aml: false

# Dataset args
dataset: "cocostuff"
load_size: 512
final_size: 32
# load_size: 768
# final_size: 48

# Model Args
model_type: "dino_vitb16"
kernel_size: 16
activation_type: "token"

# Upsampling args
outlier_detection: True
upsampler_type: "jbu_stack"
downsampler_type: "attention"
max_pad: 50
max_zoom: 2
n_jitters: 5
random_projection: 30
crf_weight: 0.001
filter_ent_weight: 0.0
tv_weight: 0.0

implicit_sup_weight: 1.0

use_norm: False

# Training args
batch_size: 2
epochs: 1
num_gpus: 2
num_workers: 12
lr: 3e-4

# No need to change
hydra:
  run:
    dir: "."
  output_subdir: ~

